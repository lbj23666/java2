server:
  port: 8080

spring:
  application:
    name: hero-association
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hero_association?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # SQL 日志：调试时改成 org.apache.ibatis.logging.stdout.StdOutImpl，平时保持 noLogging
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    # 下划线自动转驼峰：hero_class -> heroClass
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
